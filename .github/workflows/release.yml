name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix webview-ui

      - name: Package VSIX
        run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Easy Git ${GITHUB_REF_NAME}

          IntelliJ IDEA-style Git for VS Code and Cursor.

          Install: Command Palette → \`Extensions: Install from VSIX...\` → pick the attached \`.vsix\`.

          Docs: https://github.com/LumiSpring/easy-git-vscode
          EOF
          gh release create "${GITHUB_REF_NAME}" easy-git-*.vsix \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md"
